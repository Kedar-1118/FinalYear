name: MABSplit++ CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test-suite:
    name: Python Test & Coverage Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest & Generate Coverage
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

  cpp-engine-build:
    name: C++17 Engine Build & Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Engine
        run: cmake --build build --config Release

      - name: Run C++ Engine Benchmark Test
        working-directory: build
        run: ctest --output-on-failure -C Release
